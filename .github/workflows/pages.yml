name: patchplay web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Must match the wasm-bindgen version pinned in crates/kerf-web/Cargo.toml.
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked

      - name: Install binaryen
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # BASE is the path patchplay is served from. The default "/" is right for the custom domain
      # (patchplay.kerfaudio.com, named by ui/public/CNAME); set the PATCHPLAY_BASE repository
      # variable, say to "/patchplay/", to serve from a github.io project site instead.
      - name: Build patchplay
        run: scripts/build-web.sh
        env:
          BASE: ${{ vars.PATCHPLAY_BASE || '/' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
