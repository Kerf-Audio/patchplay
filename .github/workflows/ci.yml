name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Audio, webview and plugin GUI system libraries
        run: >
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          libgl-dev libjack-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev
          libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev
      # kerf-app embeds ui/dist when it compiles. The built UI is not checked in, so an empty
      # folder stands in; the `ui` job builds the real thing.
      - run: mkdir -p ui/dist
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: The web engine builds for wasm
        run: cargo check --profile web --target wasm32-unknown-unknown -p kerf-web

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Desktop target type-checks and bundles
        run: npm run build
