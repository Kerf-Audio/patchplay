[package]
name = "kerf-web"
description = "patchplay in the browser: the shared bridge and the headless audio engine as one WebAssembly module (wasm-bindgen)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kerf-audio.workspace = true
kerf-bridge.workspace = true
kerf-core.workspace = true
kerf-engine.workspace = true
serde_json.workspace = true
# `wasm-bindgen` must match the installed CLI exactly (`cargo install wasm-bindgen-cli --version 0.2.130`).
wasm-bindgen = "=0.2.130"

[lints]
workspace = true
