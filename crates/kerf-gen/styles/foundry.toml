# Foundry: hard, industrial, kick-led. A ducked low bass under four-on-the-floor,
# polymetric hats and toms, a clap on 2 and 4, and sometimes a droning bed.
# Modelled on presets/steel-shop.kerf.
#
# Rhythm rule: the kick is Ruler lane A at 16 steps and never thins; lanes B
# and C get their own shorter lengths (none is 16, none repeats) and a chance
# below 1. The bass loops are short and of different lengths.

name = "foundry"
title = "Foundry"
summary = "Four-on-the-floor kick, ducked low bass, polymetric hats and toms, and an optional drone."
tempo = [136, 146]
keys = ["C minor", "D minor", "E minor", "F minor", "G minor", "A minor"]

[[modules]]
id = "tally1"
kind = "Tally"
[modules.params]
tempo = 0.5
swing = [0.0, 0.1]
divide = 0.5

[[modules]]
id = "mix"
kind = "Router"
[modules.params]
level1 = [0.65, 0.78]
level2 = [0.36, 0.46]
level3 = [0.28, 0.4]
level4 = [0.22, 0.34]
level5 = [0.32, 0.45]
level6 = [0.22, 0.32]

[[modules]]
id = "out"
kind = "Finish"
[modules.params]
volume = 0.7
glue = [0.4, 0.6]
ceiling = 0.8

[[cables]]
from = "mix.mix_l"
to = "out.l"

[[cables]]
from = "mix.mix_r"
to = "out.r"

[[parts]]
id = "drums"
name = "Drums"
colour = "#c94a3d"

[[parts.modules]]
id = "ruler1"
kind = "Ruler"
[parts.modules.params]
hits_a = 0.25
steps_a = 1
hits_b = [0.55, 0.8]
steps_b = { steps = [6, 9] }
hits_c = [0.3, 0.5]
steps_c = { steps = [3, 5] }
hits_d = 0
chance = [0.6, 0.85]

[[parts.modules]]
id = "ruler2"
kind = "Ruler"
[parts.modules.params]
hits_a = 0.125
steps_a = 0.467
hits_b = 0
hits_c = 0
hits_d = 0
rotate = 0.5

[[parts.modules]]
id = "kick"
kind = "Mortise"
[parts.modules.params]
engine = 0
pitch = [0.28, 0.42]
punch = [0.55, 0.75]
decay = [0.2, 0.32]
tone = [0.3, 0.5]

[[parts.modules]]
id = "hat"
kind = "Mortise"
[parts.modules.params]
engine = 0.5
pitch = [0.4, 0.6]
punch = 0.5
decay = [0.1, 0.2]
tone = [0.5, 0.7]

[[parts.modules]]
id = "tom"
kind = "Mortise"
[parts.modules.params]
engine = { pick = [0.25, 1.0] }
pitch = [0.6, 0.8]
punch = [0.5, 0.7]
decay = [0.2, 0.3]
tone = [0.4, 0.6]

[[parts.modules]]
id = "clap"
kind = "Mortise"
[parts.modules.params]
engine = 0.75
pitch = 0.5
punch = [0.5, 0.7]
decay = [0.3, 0.4]
tone = [0.4, 0.5]

# The kick's envelope ducks the bass.
[[parts.modules]]
id = "duck"
kind = "Bevel"
[parts.modules.params]
attack = 0
decay = [0.4, 0.55]
sustain = 0
release = [0.4, 0.55]
curve = [0.2, 0.4]

[[parts.cables]]
from = "tally1.clock"
to = "ruler1.clock"

[[parts.cables]]
from = "tally1.clock"
to = "ruler2.clock"

[[parts.cables]]
from = "ruler1.a"
to = "kick.trig"

[[parts.cables]]
from = "ruler1.a"
to = "duck.gate"

[[parts.cables]]
from = "ruler1.b"
to = "hat.trig"

[[parts.cables]]
from = "ruler1.c"
to = "tom.trig"

[[parts.cables]]
from = "ruler2.a"
to = "clap.trig"

[[parts.cables]]
from = "kick.out"
to = "mix.in1"

[[parts.cables]]
from = "hat.out"
to = "mix.in3"

[[parts.cables]]
from = "tom.out"
to = "mix.in4"

[[parts.cables]]
from = "clap.out"
to = "mix.in5"

[[parts]]
id = "bass"
name = "Bass"
colour = "#3d63c9"

[[parts.modules]]
id = "bseq"
kind = "Dovetail"
[parts.modules.params]
steps_a = { steps = [4, 8] }
steps_b = { steps = [2, 3] }
interlock = [0.8, 1.0]
chance = [0.7, 0.9]
glide = [0.0, 0.1]
range = [0.05, 0.15]

[[parts.modules]]
id = "bosc"
kind = "Chisel"
[parts.modules.params]
tune = { octave = [-2, -1] }
shape = 0
pw = 0.5

[[parts.modules]]
id = "benv"
kind = "Bevel"
[parts.modules.params]
attack = 0
decay = [0.3, 0.4]
sustain = 0
release = [0.25, 0.35]
curve = [0.2, 0.4]

[[parts.modules]]
id = "bflt"
kind = "Plane"
[parts.modules.params]
cutoff = [0.28, 0.42]
res = [0.35, 0.55]
mode = 0
drive = [0.4, 0.6]

[[parts.modules]]
id = "bamp"
kind = "Clamp"
[parts.modules.params]
level = 0
response = [0.05, 0.15]

[[parts.modules]]
id = "bduck"
kind = "Clamp"
[parts.modules.params]
level = 0
response = 0

[[parts.cables]]
from = "tally1.clock"
to = "bseq.clock"

[[parts.cables]]
from = "bseq.pitch"
to = "bosc.voct"

[[parts.cables]]
from = "bseq.gate"
to = "benv.gate"

[[parts.cables]]
from = ["bosc.saw", "bosc.square"]
to = "bflt.in"

[[parts.cables]]
from = "bosc.sub"
to = "bflt.in"
chance = 0.4

[[parts.cables]]
from = "benv.env"
to = "bflt.cutoff"

[[parts.cables]]
from = "bflt.out"
to = "bamp.in"

[[parts.cables]]
from = "benv.env"
to = "bamp.cv"

[[parts.cables]]
from = "bamp.out"
to = "bduck.in"

[[parts.cables]]
from = "duck.inverted"
to = "bduck.cv"

[[parts.cables]]
from = "bduck.out"
to = "mix.in2"

# A drone bed: a slow swell on every bar. Stands in for noise textures until
# Sawdust has a voice.
[[parts]]
id = "drone"
name = "Drone"
colour = "#6b6b6b"
chance = 0.6

[[parts.modules]]
id = "dosc"
kind = "Chisel"
[parts.modules.params]
tune = { octave = [-2, -1] }
shape = [0.0, 0.3]
pw = 0.5

[[parts.modules]]
id = "dflt"
kind = "Plane"
[parts.modules.params]
cutoff = [0.2, 0.35]
res = [0.2, 0.4]
mode = 0
drive = [0.2, 0.4]

[[parts.modules]]
id = "denv"
kind = "Bevel"
[parts.modules.params]
attack = [0.4, 0.6]
decay = [0.5, 0.7]
sustain = [0.3, 0.5]
release = [0.5, 0.7]
curve = 0.5

[[parts.modules]]
id = "damp"
kind = "Clamp"
[parts.modules.params]
level = 0
response = 0.3

[[parts.cables]]
from = "tally1.bar"
to = "denv.gate"

[[parts.cables]]
from = ["dosc.saw", "dosc.square"]
to = "dflt.in"

[[parts.cables]]
from = "dflt.out"
to = "damp.in"

[[parts.cables]]
from = "denv.env"
to = "damp.cv"

[[parts.cables]]
from = "damp.out"
to = "mix.in6"
