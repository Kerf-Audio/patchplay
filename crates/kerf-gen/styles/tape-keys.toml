# Tape Keys: warm, wobbly keys and a soft pad over laid-back, dusty drums,
# with vinyl crackle and a small tape-echoed room.
#
# Rhythm rule: the kick and the snare are Ruler lane A at 16 steps and never
# thin; the hat lane gets its own shorter length (not 16) and a chance below
# 1. The keys Dovetail has two lane lengths that never match and a chance
# below 1, so the phrase drifts against the drums.
#
# Key: every pitch goes through a Fret whose root is the patch key and whose
# scale is a subset of major.

name = "tape-keys"
title = "Tape Keys"
summary = "Wobbly electric keys and a soft pad over laid-back dusty drums, with vinyl crackle and a tape-echoed room."
tempo = [78, 90]
keys = ["C major", "F major", "G major", "D major", "A major"]

[[modules]]
id = "tally1"
kind = "Tally"
[modules.params]
tempo = 0.5
swing = [0.15, 0.3]
divide = 0.5

[[modules]]
id = "mix"
kind = "Router"
[modules.params]
level1 = [0.45, 0.55]
level2 = [0.4, 0.5]
level3 = [0.3, 0.4]
level4 = [0.5, 0.6]
level5 = [0.4, 0.5]
level6 = [0.28, 0.38]
send = [0.2, 0.3]

[[modules]]
id = "out"
kind = "Finish"
[modules.params]
volume = [0.62, 0.7]
glue = [0.35, 0.5]
ceiling = 0.8

[[cables]]
from = "mix.mix_l"
to = "out.l"

[[cables]]
from = "mix.mix_r"
to = "out.r"

# The keys: a wavetable voice with a slow wobble in its table position and a
# plucked envelope, a touch of tape saturation, and a low-pass whose cutoff
# comes from a macro. A Ply pad sits under it on the same notes.
[[parts]]
id = "keys"
name = "Keys pad"
colour = "#7a4fb5"

[[parts.modules]]
id = "kseq"
kind = "Dovetail"
[parts.modules.params]
steps_a = { steps = [5, 7] }
steps_b = { steps = [3, 4] }
interlock = [0.4, 0.6]
chance = [0.6, 0.8]
glide = [0.0, 0.1]
range = [0.25, 0.35]

[[parts.modules]]
id = "kfret"
kind = "Fret"
[parts.modules.params]
root = { root = true }
scale = { pick = [0.0, 0.28571] }
octave = 0.5

[[parts.modules]]
id = "pfret"
kind = "Fret"
[parts.modules.params]
root = { root = true }
scale = { pick = [0.0, 0.28571] }
octave = 0.375

[[parts.modules]]
id = "klathe"
kind = "Lathe"
[parts.modules.params]
tune = 0.5
table = [0.15, 0.35]
turn = [0.3, 0.5]
warp = [0.05, 0.2]

[[parts.modules]]
id = "wobble"
kind = "Spokeshave"
[parts.modules.params]
rate = [0.1, 0.2]
spread = [0.4, 0.6]
shape = 0
phase = [0.2, 0.4]

[[parts.modules]]
id = "kenv"
kind = "Bevel"
[parts.modules.params]
attack = [0.0, 0.05]
decay = [0.55, 0.7]
sustain = [0.1, 0.25]
release = [0.45, 0.6]
curve = [0.35, 0.45]

[[parts.modules]]
id = "kamp"
kind = "Clamp"
[parts.modules.params]
level = 0
response = [0.25, 0.45]

[[parts.modules]]
id = "tape"
kind = "Rasp"
[parts.modules.params]
drive = [0.2, 0.35]
fold = [0.0, 0.1]
bias = [0.5, 0.6]
mix = [0.5, 0.7]

[[parts.modules]]
id = "age"
kind = "Jig"
[parts.modules.params]
m1 = [0.3, 0.5]
m2 = 0.5
m3 = 0.5
m4 = 0.5

[[parts.modules]]
id = "kflt"
kind = "Plane"
[parts.modules.params]
cutoff = [0.4, 0.5]
res = [0.15, 0.3]
mode = 0
drive = [0.05, 0.15]

[[parts.modules]]
id = "ply1"
kind = "Ply"
[parts.modules.params]
layers = [0.4, 0.6]
detune = [0.2, 0.35]
width = [0.7, 0.9]
tone = [0.25, 0.4]

[[parts.modules]]
id = "penv"
kind = "Bevel"
[parts.modules.params]
attack = [0.2, 0.35]
decay = [0.6, 0.7]
sustain = [0.4, 0.6]
release = [0.6, 0.75]
curve = 0.5

[[parts.modules]]
id = "pamp"
kind = "Clamp"
[parts.modules.params]
level = 0
response = [0.1, 0.25]

[[parts.cables]]
from = "tally1.div4"
to = "kseq.clock"

[[parts.cables]]
from = "kseq.pitch"
to = "kfret.pitch"

[[parts.cables]]
from = "kseq.pitch"
to = "pfret.pitch"

[[parts.cables]]
from = "kfret.pitch"
to = "klathe.voct"

[[parts.cables]]
from = "pfret.pitch"
to = "ply1.voct"

[[parts.cables]]
from = ["wobble.lfo1", "wobble.lfo2"]
to = "klathe.turn"

[[parts.cables]]
from = "kseq.gate"
to = "kenv.gate"

[[parts.cables]]
from = "kseq.gate"
to = "penv.gate"

[[parts.cables]]
from = "klathe.out"
to = "tape.in"

[[parts.cables]]
from = "tape.out"
to = "kflt.in"

[[parts.cables]]
from = "age.m1"
to = "kflt.cutoff"

[[parts.cables]]
from = "kenv.env"
to = "kflt.cutoff"

[[parts.cables]]
from = "kflt.out"
to = "kamp.in"

[[parts.cables]]
from = "kenv.env"
to = "kamp.cv"

[[parts.cables]]
from = "kamp.out"
to = "mix.in4"

[[parts.cables]]
from = "kamp.out"
to = "echo.in"

[[parts.cables]]
from = "ply1.l"
to = "pamp.in"

[[parts.cables]]
from = "ply1.r"
to = "pamp.in"

[[parts.cables]]
from = "penv.env"
to = "pamp.cv"

[[parts.cables]]
from = "pamp.out"
to = "mix.in5"

[[parts]]
id = "drums"
name = "Dusty drums"
colour = "#c94a3d"

[[parts.modules]]
id = "ruler1"
kind = "Ruler"
[parts.modules.params]
hits_a = { pick = [0.125, 0.1875] }
steps_a = 1
hits_b = [0.5, 0.7]
steps_b = { steps = [7, 11] }
hits_c = 0
hits_d = 0
chance = [0.6, 0.8]

[[parts.modules]]
id = "ruler2"
kind = "Ruler"
[parts.modules.params]
hits_a = 0.125
steps_a = 1
hits_b = [0.12, 0.2]
steps_b = { steps = [11, 14] }
hits_c = 0
hits_d = 0
rotate = 0.25
chance = [0.35, 0.55]

[[parts.modules]]
id = "kick"
kind = "Mortise"
[parts.modules.params]
engine = 0
pitch = [0.3, 0.4]
punch = [0.4, 0.55]
decay = [0.3, 0.4]
tone = [0.25, 0.4]

[[parts.modules]]
id = "snare"
kind = "Mortise"
[parts.modules.params]
engine = 0.25
pitch = [0.4, 0.5]
punch = [0.4, 0.55]
decay = [0.35, 0.45]
tone = [0.3, 0.4]

[[parts.modules]]
id = "hat"
kind = "Mortise"
[parts.modules.params]
engine = 0.5
pitch = [0.45, 0.55]
punch = [0.3, 0.4]
decay = [0.12, 0.2]
tone = [0.4, 0.5]

[[parts.modules]]
id = "sflt"
kind = "Plane"
[parts.modules.params]
cutoff = [0.45, 0.6]
res = [0.1, 0.2]
mode = 0
drive = [0.1, 0.2]

[[parts.modules]]
id = "hflt"
kind = "Plane"
[parts.modules.params]
cutoff = [0.5, 0.65]
res = [0.1, 0.2]
mode = 0
drive = 0.1

[[parts.cables]]
from = "tally1.clock"
to = "ruler1.clock"

[[parts.cables]]
from = "tally1.clock"
to = "ruler2.clock"

[[parts.cables]]
from = "ruler1.a"
to = "kick.trig"

[[parts.cables]]
from = "ruler1.b"
to = "hat.trig"

[[parts.cables]]
from = "ruler2.a"
to = "snare.trig"

[[parts.cables]]
from = "ruler2.b"
to = "snare.trig"

[[parts.cables]]
from = "kick.out"
to = "mix.in1"

[[parts.cables]]
from = "snare.out"
to = "sflt.in"

[[parts.cables]]
from = "sflt.out"
to = "mix.in2"

[[parts.cables]]
from = "hat.out"
to = "hflt.in"

[[parts.cables]]
from = "hflt.out"
to = "mix.in3"

# Vinyl: crackle and hiss through a low-pass, and a Veneer playing the noise
# slices of its built-in sample, slowed down, off the hat lane.
[[parts]]
id = "dust"
name = "Vinyl dust"
colour = "#3d9c8a"
chance = 0.85

[[parts.modules]]
id = "sand"
kind = "Sawdust"
[parts.modules.params]
colour = [0.35, 0.5]
crackle = [0.45, 0.7]

[[parts.modules]]
id = "slice"
kind = "Veneer"
[parts.modules.params]
slice = { pick = [0.34375, 0.46875, 0.59375, 0.71875] }
speed = [0.3, 0.45]
reverse = 0
looped = 0

[[parts.modules]]
id = "dflt"
kind = "Plane"
[parts.modules.params]
cutoff = [0.4, 0.55]
res = [0.1, 0.2]
mode = 0
drive = 0.1

[[parts.modules]]
id = "damp"
kind = "Clamp"
[parts.modules.params]
level = [0.3, 0.45]
response = 0

[[parts.cables]]
from = "sand.noise"
to = "dflt.in"
chance = 0.6

[[parts.cables]]
from = "sand.dust"
to = "dflt.in"

[[parts.cables]]
from = "ruler1.b"
to = "slice.trig"

[[parts.cables]]
from = "slice.l"
to = "dflt.in"

[[parts.cables]]
from = "dflt.out"
to = "damp.in"

[[parts.cables]]
from = "damp.out"
to = "mix.in6"

# A tape echo on the keys and a small room that the mixer's send also feeds.
[[parts]]
id = "space"
name = "Space"
colour = "#d1a233"

[[parts.modules]]
id = "echo"
kind = "Bandsaw"
[parts.modules.params]
time = { pick = [0.19, 0.31, 0.44] }
feedback = [0.3, 0.45]
wear = [0.5, 0.7]
mix = 1

[[parts.modules]]
id = "room"
kind = "Kiln"
[parts.modules.params]
size = [0.35, 0.5]
heat = [0.5, 0.65]
bloom = [0.2, 0.35]
mix = 1

[[parts.cables]]
from = "tally1.clock"
to = "echo.clock"

[[parts.cables]]
from = "echo.l"
to = "room.in_l"

[[parts.cables]]
from = "echo.r"
to = "room.in_r"

[[parts.cables]]
from = "mix.send"
to = "room.in_l"

[[parts.cables]]
from = "mix.send"
to = "room.in_r"

[[parts.cables]]
from = "room.l"
to = "out.l"

[[parts.cables]]
from = "room.r"
to = "out.r"
