[package]
name = "kerf-plugin"
description = "patchplay as a CLAP and VST3 instrument: runs the kerf engine on the host's audio thread, with the patch saved in the project."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# `cdylib` is the plugin binary the bundler picks up; `lib` is for the tests.
crate-type = ["cdylib", "lib"]

[features]
# Debug builds abort when `process` allocates (nih-plug's allocator check).
assert_process_allocs = ["nih_plug/assert_process_allocs"]

[dependencies]
kerf-bridge.workspace = true
kerf-core.workspace = true
kerf-engine = { workspace = true, features = ["files"] }
kerf-modules.workspace = true
# Pinned for reproducible builds; nih-plug has no releases on crates.io.
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false, features = ["vst3"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
rtrb.workspace = true
serde.workspace = true

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
