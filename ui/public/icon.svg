<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2c30"/>
      <stop offset="1" stop-color="#141517"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#bfbdb6"/>
    </linearGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a3d"/>
      <stop offset="1" stop-color="#f2470f"/>
    </linearGradient>
    <radialGradient id="hole" cx=".5" cy=".4" r=".7">
      <stop offset="0" stop-color="#0c0c0d"/>
      <stop offset="1" stop-color="#232427"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="112" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <g filter="url(#drop)">
    <circle cx="150" cy="150" r="60" fill="url(#nut)"/>
    <circle cx="362" cy="362" r="60" fill="url(#nut)"/>
  </g>
  <circle cx="150" cy="150" r="38" fill="url(#hole)" stroke="#000" stroke-opacity=".35" stroke-width="3"/>
  <circle cx="362" cy="362" r="38" fill="url(#hole)" stroke="#000" stroke-opacity=".35" stroke-width="3"/>
  <g filter="url(#drop)">
    <path d="M150 150 C150 330 362 182 362 362" fill="none" stroke="url(#cable)" stroke-width="30" stroke-linecap="round"/>
  </g>
  <path d="M150 150 C150 330 362 182 362 362" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="6" stroke-linecap="round" transform="translate(0 -7)"/>
  <circle cx="150" cy="150" r="19" fill="url(#cable)" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>
  <circle cx="362" cy="362" r="19" fill="url(#cable)" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>
</svg>
